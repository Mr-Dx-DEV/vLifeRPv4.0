# README - Drive By Installation

## Step 1: Choose a Script

In the "essentials" folder, you will find two different scripts:

1. **Take Over**: Works with any vehicle in your server.
2. **Gang Style**: Only works with selected vehicles, which you must configure in the `layout.meta` file.

Choose one of these scripts based on your needs.

## Step 2: Add to "resources"

After choosing the script you prefer, add the selected script to your server's `resources` folder.

## Step 3: Additional Configuration for "Gang Style"

If you choose the **Gang Style** script, you will need to add a vehicle pack for it to work. You can choose from the following:

- **Vanilla** vehicle pack.
- **Add-On** vehicle pack.
- Or both packs together.

Then, add the selected vehicles to the `layout.meta` file.

## Step 4: Start the Server

Once everything is configured, start your server to load the changes.

### Additional Notes:

- Ensure that all the script files are correctly placed inside the `resources` folder.
- If using the Gang Style script, check the `layout.meta` file to ensure the selected vehicles are properly configured.

